# Mikroserwisy: catalog (wewnętrzny) + gateway (publiczny), każdy z osobnym obrazem i wersją
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: __NS__
  labels: {app: catalog, type: microservice}
spec:
  replicas: __REPLICAS__
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, type: microservice}
      annotations: {deploy/commit: "__COMMIT__"}
    spec:
      containers:
        - name: app
          image: __CATALOG_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_BROKEN, value: "__BROKEN__"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: __NS__
spec:
  selector: {app: catalog}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: __NS__
  labels: {app: gateway, type: microservice}
spec:
  replicas: __REPLICAS__
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, type: microservice}
      annotations: {deploy/commit: "__COMMIT__"}
    spec:
      containers:
        - name: app
          image: __GATEWAY_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_ENV, value: "__APP_ENV__"}
            - {name: CATALOG_URL, value: "http://catalog:8000"}
            - {name: APP_BROKEN, value: "__BROKEN__"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: __NS__
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8080, nodePort: __GW_PORT__}]
