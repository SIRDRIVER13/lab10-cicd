# Klaster dla środowisk test i prod (osobne przestrzenie nazw)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab10
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30110, hostPort: 30110}   # test: monolit
      - {containerPort: 30120, hostPort: 30120}   # test: mikroserwisy (gateway)
      - {containerPort: 30210, hostPort: 30210}   # prod: monolit
      - {containerPort: 30220, hostPort: 30220}   # prod: mikroserwisy (gateway)
